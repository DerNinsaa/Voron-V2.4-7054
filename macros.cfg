[gcode_macro PRINT_START]
description: Called at the start of the Print
gcode:
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("50")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set target_offset = params.OFFSET|default("0.06")|float %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  ChamberLED_ON
  SET_GCODE_OFFSET Z=0

  CLEAR_PAUSE
  STATUS_HOMING
  G28
  G0 Z+2
  G90

  BED_MESH_CLEAR

  {% if target_bed > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    STATUS_HEATING
 
    M106 S255
    SET_FAN_SPEED FAN=nevermore SPEED=0.8
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor Chamber" MINIMUM={target_chamber_wait}

  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    STATUS_HEATING
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}
    SET_DISPLAY_TEXT MSG="Soak for 5 min"
    G4 P300000
  {% endif %}

  SET_DISPLAY_TEXT MSG="Hotend: 150c"
  M109 S150

  BRUSH_NOZZLE
  G28 Z METHOD=CONTACT CALIBRATE=1

  SET_DISPLAY_TEXT MSG="Leveling"
  STATUS_LEVELING
  QUAD_GANTRY_LEVEL
  G28 Z

  SET_DISPLAY_TEXT MSG="Bed mesh"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1

  G28 Z METHOD=CONTACT CALIBRATE=0

  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107
  M109 S{target_extruder}

  SET_GCODE_OFFSET Z={target_offset}

  # ---------- Purge / prime line, then hand off to the print ----------
  SET_DISPLAY_TEXT MSG="Printing..."
  STATUS_PRINTING

[gcode_macro PRINT_END]
description: Called at the end of the Print
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
  M400
  G92 E0
  G1 E-10.0 F3600
  TURN_OFF_HEATERS
  G90
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000
  G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 2} F3600
  M107
  SET_FAN_SPEED FAN=nevermore SPEED=0
  BED_MESH_CLEAR
  STATUS_OFF
  M84
  SET_DISPLAY_TEXT MSG="Done printing"
    
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    CLEAR_PAUSE
    PRINT_END
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pause Macro, parks the Printhead Center Front
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}

    STATUS_BUSY
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}

        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z{z} F900
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000
        SAVE_GCODE_STATE NAME=PAUSEPARK
        M104 S0
        SET_IDLE_TIMEOUT TIMEOUT=43200
    {% endif %}

[gcode_macro RESUME]
description: Resume Macro
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(2.5)|int %}

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if etemp > 0 %}
            M109 S{etemp|int}
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100
        G91
        M83
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900
        {% else %}
            G1 Z{zhop * -1} F900
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60
        STATUS_PRINTING                         
        BASE_RESUME
    {% endif %}

[gcode_macro M600]
description: Used for Slicers, Calls pause macro
gcode:
    PAUSE

[gcode_macro BRUSH_NOZZLE]

variable_x1: 103
variable_x2: 143
variable_y1: 355

gcode:
    M400
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90
    G0 X{x1} F5000
    G0 Y{y1} F5000
    
    M117 Brushing Nozzle
    G0 X{x2} F5000
    G0 X{x1}
    G0 X{x2}
    G0 X{x1}
    G0 X{x2}
    G0 X{x1}
    G0 X{x2}
    G0 X{x1}
    M117 Nozzle Cleaned

# Macros for Spoolman

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

[idle_timeout]
timeout: 1200
gcode:
  BACKUP_CFG
  LOG_ROLLOVER
  ChamberLED_OFF

[gcode_macro ChamberLED_ON]
description: "Schaltet die Chamber Lighting ein (weiß)"
gcode:
  SET_LED LED=Chamber_Lighting WHITE=1

[gcode_macro ChamberLED_OFF]
description: "Schaltet die Chamber Lighting aus"
gcode:
  SET_LED LED=Chamber_Lighting WHITE=0